<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {%block title%}
        Django App
        {%endblock%}
    </title>
    <link rel="stylesheet" href="{%static 'css/style.css'%}">
    <script src="{%static 'js/main.js' %}" defer></script>
</head>
<body>
    <nav>
        <a href="/">Home</a> | 
        <a href="/about">About</a> | 
        <a href="{% url 'statblocks:list' %}">Statblocks</a> | 
        <a href="{% url 'statblocks:traits_list' %}">Traits</a> |
        <a href="{% url 'statblocks:new-statblock' %}">Create New Statblock</a> |

        <div class="topnav-right">
        {% if user.is_authenticated %}
            <a> {{user.username}} </a>

            <form class='logout'
             action="{% url 'users:logout' %}"
             method = 'post'>
             {% csrf_token %}
            <button class="logout-button">
                🚪
            </button>
            </form>
        {% else %}
        | <a href="{% url 'users:login' %}">Log In</a>
        | <a href="{% url 'users:register' %}">Register</a>
        {% endif %}

        </div> 

    </nav>
    <main>
        {%block content%}
        {%endblock%}
    </main>
</body>
</html>
